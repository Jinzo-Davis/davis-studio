<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Davis Studio — Quản trị</title><meta name="robots" content="noindex,nofollow"><script>window.DAVIS_MODE='admin';</script><script src="firebase-config.js"></script><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Playfair+Display:wght@600&display=swap"><style id="app-css">:root{
  color-scheme:dark;
  --bg:#141618;--panel:#1b1e21;--panel-2:#23272b;--panel-3:#2b3035;
  --line:#2e3338;--line-2:#3d444a;
  --text:#ebe8e3;--muted:#9ba1a6;--faint:#6d747a;
  --brass:#c8a15b;--brass-2:#e2bd7c;--brass-ink:#1b1407;
  --danger:#e26d62;--ok:#6dbf8b;
  --mat:#262d29;--mat-line:rgba(190,215,200,.055);--mat-line-2:rgba(190,215,200,.1);
  --font-ui:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-brand:'Playfair Display',Georgia,serif;
  --r:10px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--font-ui);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
h3{margin:0;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
p{margin:0}
.muted{color:var(--muted)}
.ic{flex:none;display:block}
#root{min-height:100%;display:flex;flex-direction:column}

/* header */
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0}
.brand b{font:600 20px var(--font-brand);letter-spacing:.3em;color:var(--text)}
.brand span{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;border-radius:9px;background:var(--panel-3);border:1px solid var(--line-2);font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:#343a40}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--brass);border-color:var(--brass);color:var(--brass-ink);font-weight:600}
.btn.pri:hover{background:var(--brass-2)}
.btn.ghost{background:transparent}
.btn.dng{color:var(--danger)}
.btn.sm{height:32px;padding:0 10px;font-size:13px}
.ibtn{width:38px;height:38px;display:inline-grid;place-items:center;border-radius:9px;border:1px solid var(--line-2);background:var(--panel-3)}
.ibtn:hover{background:#343a40}
.ibtn:disabled{opacity:.35;cursor:default}
.ibtn.sm{width:32px;height:32px}
[hidden]{display:none!important}

/* layout */
.work{flex:1;display:grid;grid-template-columns:300px minmax(0,1fr) 340px;min-height:0;height:calc(100dvh - 59px)}
.picker,.inspector{background:var(--panel);overflow:auto;padding:18px 16px;display:flex;flex-direction:column;gap:22px}
.picker{border-right:1px solid var(--line)}
.inspector{border-left:1px solid var(--line)}
.stagewrap{display:flex;flex-direction:column;min-width:0;min-height:0}
.stage{position:relative;flex:1;min-height:320px;padding:22px;overflow:hidden;
  background:
   linear-gradient(var(--mat-line-2) 1px,transparent 1px) 0 0/120px 120px,
   linear-gradient(90deg,var(--mat-line-2) 1px,transparent 1px) 0 0/120px 120px,
   linear-gradient(var(--mat-line) 1px,transparent 1px) 0 0/24px 24px,
   linear-gradient(90deg,var(--mat-line) 1px,transparent 1px) 0 0/24px 24px,
   var(--mat)}
#cv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);touch-action:none;display:block}
.stage-note{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:12px;color:var(--faint);pointer-events:none;padding:0 16px}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);pointer-events:none}
.stagebar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);border-top:1px solid var(--line)}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{height:32px;padding:0 14px;border-radius:7px;color:var(--muted);white-space:nowrap;font-weight:500}
.seg button.on{background:var(--panel-3);color:var(--text);box-shadow:inset 0 0 0 1px var(--line-2)}
.stagebar .sp{flex:1}

/* picker */
.sec{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec-h h3 em{font-style:normal;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--brass);color:var(--brass-ink);font-size:11px;margin-right:8px;letter-spacing:0}
.prods{display:flex;flex-direction:column;gap:8px}
.prod{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel-2);text-align:left;transition:border-color .15s}
.prod:hover{border-color:var(--line-2)}
.prod.on{border-color:var(--brass);background:#2a2822}
.prod .code{width:38px;height:38px;flex:none;display:grid;place-items:center;border-radius:8px;background:var(--bg);font:600 20px var(--font-brand);color:var(--brass-2)}
.prod .pn{font-weight:500;line-height:1.3}
.sw{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.sw button{aspect-ratio:1;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 2px rgba(0,0,0,.35),inset 0 6px 8px rgba(255,255,255,.12);position:relative}
.sw button.on{border-color:var(--brass-2);outline:2px solid var(--bg);outline-offset:-5px}
.cur{color:var(--muted)}
.cur b{color:var(--text);font-weight:600}

/* inspector */
.layers{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.layer{width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);text-align:left;min-width:0}
.layer span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layer.on{border-color:var(--brass)}
.fld{display:flex;flex-direction:column;gap:6px}
.fld>span,.sl>span{font-size:12px;color:var(--muted)}
textarea,input[type=text],input[type=number],input[type=url],select{width:100%;background:var(--bg);border:1px solid var(--line-2);border-radius:8px;padding:9px 11px;min-height:38px}
textarea{resize:vertical;line-height:1.4}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.row .sp{flex:1}
.tg{min-width:36px;height:34px;padding:0 10px;display:inline-grid;place-items:center;border-radius:8px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--muted)}
.tg[aria-pressed=true]{background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}
.sl{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.sl output{font-size:12px;color:var(--text);font-variant-numeric:tabular-nums}
.sl input{grid-column:1/-1}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--line-2)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line-2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--brass);border:3px solid var(--panel);margin-top:-8px}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--brass);border:3px solid var(--panel)}
.fontcur{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:8px 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--bg);font-size:20px;min-height:44px}
.fontcur small{font:12px var(--font-ui);color:var(--muted);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.fontpick{border:1px solid var(--line-2);border-radius:10px;background:var(--bg);overflow:hidden}
.fontpick .cats{display:flex;gap:4px;padding:8px;overflow-x:auto;border-bottom:1px solid var(--line)}
.fontpick .cats button{padding:5px 10px;border-radius:14px;font-size:12px;color:var(--muted);white-space:nowrap;border:1px solid var(--line)}
.fontpick .cats button.on{background:var(--panel-3);color:var(--text);border-color:var(--line-2)}
.fontpick .list{max-height:280px;overflow:auto}
.frow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:8px 12px;border-bottom:1px solid var(--line);text-align:left}
.frow:hover{background:var(--panel-2)}
.frow.on{background:#2a2822}
.frow .fs{font-size:22px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.frow .fn{font:11px var(--font-ui);color:var(--faint);white-space:nowrap}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.tip{font-size:12px;color:var(--muted);background:var(--panel-2);border:1px dashed var(--line-2);border-radius:8px;padding:9px 11px}
.motifgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;max-height:min(50vh,380px);overflow:auto;padding:10px}
.motifcard{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 8px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);text-align:center}
.motifcard:hover{border-color:var(--line-2)}
.motifcard:disabled{opacity:.5}
.motifcard img{width:56px;height:56px;object-fit:contain;background:var(--bg);border-radius:8px;padding:6px}
.motifcard span{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.admmotifs{display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;gap:12px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2)}
.mrow img{width:48px;height:48px;object-fit:contain;background:var(--bg);border-radius:8px;padding:4px;flex:none}
.mfields{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px;min-width:0}


/* modal & toast */
.modal-bg{position:fixed;inset:0;background:rgba(6,8,9,.72);z-index:60;display:grid;place-items:center;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line-2);border-radius:14px;width:min(920px,100%);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.modal.sm{width:min(560px,100%)}
.mh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mh h2{margin:0;font-size:16px;font-weight:600}
.mb{padding:18px;overflow:auto;display:flex;gap:20px}
.mb.col{flex-direction:column}
.mf{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;padding:14px 18px;border-top:1px solid var(--line)}

.fbov{position:fixed;inset:0;background:var(--bg);color:var(--text);display:grid;place-items:center;z-index:9999;text-align:center;padding:24px}
.fbov .fbbox{max-width:420px}
.fbov h2{font:600 20px var(--font-brand);letter-spacing:.02em;margin:0 0 10px}
.fbov p{color:var(--muted);margin:0 0 18px;line-height:1.5}
.fbov .spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line-2);border-top-color:var(--brass);animation:fbspin .8s linear infinite;margin:0 auto 18px}
@keyframes fbspin{to{transform:rotate(360deg)}}
.prev{flex:1;min-width:0;display:grid;place-items:center;background:var(--mat);border-radius:10px;padding:14px;min-height:220px}
.prev img{max-width:100%;max-height:62vh;display:block;border-radius:4px;box-shadow:0 8px 30px rgba(0,0,0,.4);-webkit-touch-callout:default;user-select:auto}
.side-opts{width:290px;flex:none;display:flex;flex-direction:column;gap:14px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);cursor:pointer}
.opt input{margin-top:3px;accent-color:var(--brass)}
.opt b{display:block;font-weight:500}
.opt span{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#0d0f10;border:1px solid var(--line-2);color:var(--text);padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:90;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.linkbtn{display:inline-flex;align-items:center;justify-content:center;height:38px;padding:0 14px;border-radius:9px;border:1px solid var(--line-2);background:var(--panel-3);text-decoration:none;color:var(--text);font-weight:500}

/* admin */
.adm{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.adm-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.adm-top h2{margin:0;font-size:16px;font-weight:600;margin-right:8px}
.adm-top .sp{flex:1}
.adm-tabs{display:flex;gap:2px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
.adm-tabs button{padding:12px 14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.adm-tabs button.on{color:var(--text);border-color:var(--brass)}
.adm-body{flex:1;overflow:auto;padding:18px 16px 40px}
.adm-in{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.adm-cols{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px}
.adm-list{display:flex;flex-direction:column;gap:8px}
.arow{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2)}
.arow.on{border-color:var(--brass)}
.arow .pick{flex:1;display:flex;align-items:center;gap:10px;text-align:left;min-width:0}
.arow .pick .code{width:30px;height:30px;border-radius:7px;background:var(--bg);display:grid;place-items:center;font:600 16px var(--font-brand);color:var(--brass-2);flex:none}
.arow .pick span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px}
.card h4{margin:0;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2 .fld.w1{grid-column:1/-1}
.zed{position:relative;display:inline-block;max-width:100%;background:conic-gradient(#3a4046 25%,#2c3136 0 50%,#3a4046 0 75%,#2c3136 0) 0 0/20px 20px;border-radius:8px;overflow:hidden;touch-action:none;align-self:flex-start}
.zed img{display:block;max-width:100%;max-height:340px;user-select:none;-webkit-user-drag:none}
.zr{position:absolute;border:2px dashed var(--brass-2);background:rgba(200,161,91,.16);cursor:move}
.zh{position:absolute;width:18px;height:18px;background:var(--brass);border:2px solid #000;border-radius:50%}
.zh.tl{left:-10px;top:-10px;cursor:nwse-resize}.zh.tr{right:-10px;top:-10px;cursor:nesw-resize}.zh.bl{left:-10px;bottom:-10px;cursor:nesw-resize}.zh.br{right:-10px;bottom:-10px;cursor:nwse-resize}
.lrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2)}
.lrow input[type=color]{width:44px;height:38px;padding:2px;border:1px solid var(--line-2);border-radius:8px;background:var(--bg);flex:none}
.lrow input[type=text]{flex:1;min-width:120px}
.ltex-thumb{width:38px;height:38px;border-radius:8px;object-fit:cover;background:var(--bg);flex:none;border:1px solid var(--line-2)}
.ltex-empty{display:grid;place-items:center;color:var(--faint);font-size:11px}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--brass)}
.meter.warn i{background:var(--danger)}
.chk{display:flex;align-items:center;gap:10px}
.chk input{accent-color:var(--brass);width:18px;height:18px}
.checker{background:conic-gradient(#3a4046 25%,#2c3136 0 50%,#3a4046 0 75%,#2c3136 0) 0 0/20px 20px;border-radius:8px;padding:8px;display:grid;place-items:center}
.checker canvas{max-width:100%;max-height:300px}
.status{font-size:12px;padding:3px 9px;border-radius:12px;background:var(--panel-3);color:var(--muted)}
.status.warn{background:#3a2b22;color:#f0b48a}

@media (max-width:980px){
  .work{display:flex;flex-direction:column;height:auto}
  .picker{border-right:0;border-bottom:1px solid var(--line);flex-direction:column;gap:16px;padding:14px 16px}
  .prods{flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .prod{flex:none}
  .sw{display:flex;overflow-x:auto;padding:2px}
  .sw button{width:38px;flex:none}
  .stage{flex:none;height:min(62vh,118vw);min-height:280px;padding:14px}
  .inspector{border-left:0;border-top:1px solid var(--line);overflow:visible}
  .brand span{display:none}
  .mb{flex-direction:column}
  .side-opts{width:auto}
  .adm-cols{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
  .mfields{grid-template-columns:1fr}
  .mrow{align-items:flex-start}
}

/* ===== Điều hướng 3 khu vực ===== */
.nav{display:flex;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;margin-left:10px;min-width:0;overflow-x:auto}
.nav button{height:32px;padding:0 14px;border-radius:7px;color:var(--muted);font-weight:500;white-space:nowrap;flex:none}
.nav button:hover:not(.on){color:var(--text)}
.nav button.on{background:var(--panel-3);color:var(--text);box-shadow:inset 0 0 0 1px var(--line-2)}
body:not([data-view="design"]) .d-only{display:none!important}
.page{flex:1;padding:0 16px 72px}
.pg-in{max-width:1120px;margin:0 auto}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass-2);font-weight:600}
.lead{font-size:16px;color:var(--muted);max-width:58ch;line-height:1.65}
.page h1{font:600 clamp(28px,4.2vw,46px)/1.14 var(--font-brand);margin:12px 0 16px;letter-spacing:.01em;text-wrap:balance}
.page h2{font:600 clamp(22px,2.6vw,28px)/1.2 var(--font-brand);margin:0;text-wrap:balance}
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:44px;align-items:center;padding:52px 0 44px}
.hero .acts{margin-top:26px}
.hero-media{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--mat);aspect-ratio:4/3;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.hero-media img,.hero-media canvas,.hero-media iframe{width:100%;height:100%;display:block;object-fit:cover;border:0}
.blk{padding:40px 0;border-top:1px solid var(--line)}
.blk-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:22px;flex-wrap:wrap}
.blk-h p{color:var(--muted);max-width:62ch;margin-top:8px}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.feat>div,.steps li{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.feat b,.steps b{display:block;font-size:15px;font-weight:600;margin-bottom:6px}
.feat p,.steps p{color:var(--muted);font-size:13.5px;line-height:1.6}
.feat>div::before{content:'';display:block;width:26px;height:2px;background:var(--brass);margin-bottom:14px}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;counter-reset:st}
.steps li{counter-increment:st}
.steps li::before{content:counter(st);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--brass);color:var(--brass-ink);font-weight:600;margin-bottom:12px}
.note{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:32px;align-items:center}
.note .txt p{color:var(--muted);line-height:1.7;white-space:pre-line;margin-top:12px}
.note .txt .btn{margin-top:20px}
.faq{max-width:820px}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 0;font-weight:500;font-size:15px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:'+';color:var(--brass-2);font-size:22px;line-height:1;flex:none}
.faq details[open] summary::after{content:'−'}
.faq details p{color:var(--muted);padding:0 0 18px;line-height:1.65;max-width:72ch;white-space:pre-line}
.cta-band{margin-top:40px;padding:26px 28px;border-radius:16px;background:linear-gradient(135deg,#2c261b,#1b1e21 70%);border:1px solid #3d3427;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.cta-band h3{font:600 22px/1.25 var(--font-brand);text-transform:none;letter-spacing:0;color:var(--text);margin-bottom:6px}
.pg-head{padding:44px 0 22px}
.sim{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.sim.s4{grid-template-columns:repeat(2,minmax(0,1fr))}
.simc{display:flex;flex-direction:column;gap:8px;text-align:left;border-radius:12px;padding:7px;border:1px solid var(--line);background:var(--panel);transition:border-color .15s}
.simc:hover{border-color:var(--line-2)}
.simc.on{border-color:var(--brass)}
.simc canvas{width:100%;height:auto;aspect-ratio:5/3;border-radius:7px;display:block;background:var(--panel-2)}
.simc span{font-size:13px;padding:0 4px 2px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.simc small{color:var(--faint);font-size:11px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;margin-bottom:10px;scrollbar-width:thin}
.chip{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px 0 6px;border-radius:18px;border:1px solid var(--line);background:var(--panel);white-space:nowrap;color:var(--muted);font-weight:500;flex:none}
.chip.noi{padding-left:14px}
.chip i{width:24px;height:24px;border-radius:50%;background-size:cover;background-position:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.chip small{color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
.chip.on{border-color:var(--brass);color:var(--text);background:#2a2822}
.gal-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:4px 0 18px}
.gal-bar .sp{flex:1}
.gal{columns:3 250px;column-gap:14px}
.gcard{break-inside:avoid;margin:0 0 14px;display:block;width:100%;text-align:left;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--panel);transition:border-color .15s}
.gcard:hover{border-color:var(--line-2)}
.gcard img{width:100%;height:auto;display:block;background:var(--panel-2)}
.gm{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px}
.gm b{font-weight:500;font-size:14px;line-height:1.35}
.gm span{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none;background-size:cover;background-position:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.empty{padding:30px 22px;border:1px dashed var(--line-2);border-radius:12px;color:var(--muted);text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.linkish{color:var(--brass-2);font-size:13px;text-align:left;display:inline-flex;align-items:center;gap:6px}
.linkish:hover{text-decoration:underline}
.modal.lb{width:min(1120px,100%)}
.lb-body{display:grid;grid-template-columns:minmax(0,1fr) 290px;min-height:0;flex:1;overflow:hidden}
.lb-img{background:#0d0f10;display:grid;place-items:center;position:relative;min-height:280px;overflow:hidden}
.lb-img img{max-width:100%;max-height:calc(100dvh - 120px);display:block;object-fit:contain}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(20,22,24,.78);border:1px solid var(--line-2);display:grid;place-items:center}
.lb-nav:hover{background:rgba(43,48,53,.92)}
.lb-nav.l{left:12px}.lb-nav.r{right:12px}
.lb-side{padding:18px;display:flex;flex-direction:column;gap:14px;border-left:1px solid var(--line);overflow:auto}
.lb-side .cap{font-size:16px;font-weight:500;line-height:1.4}
.lb-side .meta{display:flex;flex-direction:column;gap:8px;color:var(--muted);font-size:13px}
.lb-side .meta span{display:flex;align-items:center;gap:8px}
.mrow.g img{width:76px;height:76px;object-fit:cover;padding:0}
.mfields.g3{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr)}
.mfields.ti{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.mfields textarea{min-height:38px}
.irow{display:flex;gap:10px;align-items:flex-start;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2)}
.irow .mfields{flex:1}
.hero-thumb{width:160px;aspect-ratio:4/3;object-fit:cover;border-radius:8px;border:1px solid var(--line-2);display:block}
@media (max-width:1280px){.brand span{display:none}}
@media (max-width:980px){
  .top{flex-wrap:wrap}
  .nav{order:9;width:100%;margin:0}
  .nav button{flex:1;padding:0 10px}
  .hero{grid-template-columns:1fr;gap:26px;padding:28px 0 32px}
  .note{grid-template-columns:1fr;gap:20px}
  .pg-head{padding:28px 0 16px}
  .blk{padding:30px 0}
  .lb-body{grid-template-columns:1fr;overflow:auto}
  .lb-img img{max-height:58dvh}
  .lb-side{border-left:0;border-top:1px solid var(--line)}
  .mfields.g3,.mfields.ti{grid-template-columns:1fr}
}

const PNL=(x,y,w,h,r)=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+r+'" fill="url(#g)"/><rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+r+'" fill="url(#v)"/><rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+r+'" fill="none" stroke="#6b6b6b" stroke-width="5" opacity=".55"/>';
const STI=(x,y,w,h,r)=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+r+'" fill="none" stroke="#f4f4f4" stroke-width="3.4" stroke-dasharray="11 8" opacity=".85"/>';

function svgLaurel(){
  const leaf=(cx,cy,rot,s)=>'<g transform="translate('+cx+' '+cy+') rotate('+rot+') scale('+s+')"><ellipse cx="0" cy="0" rx="10" ry="4.2" fill="#000"/></g>';
  let g='';
  for(let i=0;i<7;i++){const t=i/6,a=180+t*150,r=92-t*10,rad=a*Math.PI/180;g+=leaf(150-Math.cos(rad)*r,168-Math.sin(rad)*r,-a+90,1-t*.18);}
  for(let i=0;i<7;i++){const t=i/6,a=-(180+t*150),r=92-t*10,rad=a*Math.PI/180;g+=leaf(150-Math.cos(rad)*r,168-Math.sin(rad)*r,-a-90,1-t*.18);}
  return '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">'+g+'<circle cx="150" cy="253" r="4" fill="#000"/></svg>';
}
function svgCompass(){
  const pt=(cx,cy,ang,rO,rI)=>{const a=ang*Math.PI/180,a2=(ang+22.5)*Math.PI/180;return 'M'+cx+' '+cy+' L'+(cx+Math.cos(a)*rO)+' '+(cy+Math.sin(a)*rO)+' L'+(cx+Math.cos(a2)*rI)+' '+(cy+Math.sin(a2)*rI)+' Z';};
  let d='';for(let i=0;i<8;i++)d+=pt(150,150,i*45-90,i%2===0?118:70,44)+' ';
  return '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300"><path d="'+d+'" fill="#000"/><circle cx="150" cy="150" r="26" fill="none" stroke="#000" stroke-width="6"/><circle cx="150" cy="150" r="134" fill="none" stroke="#000" stroke-width="4"/></svg>';
}

const H={stack:[],i:-1,t:0,label:''};
function snapDesign(){return JSON.stringify(S.design);}
function histReset(){H.stack=[snapDesign()];H.i=0;H.label='';H.t=0;updateUndoUI();}
function commit(label){
  const s=snapDesign();if(H.stack[H.i]===s)return;
  const now=Date.now();
  if(label&&label===H.label&&now-H.t<900&&H.i>0){H.stack[H.i]=s;}
  else{H.stack.length=H.i+1;H.stack.push(s);H.i++;if(H.stack.length>80){H.stack.shift();H.i--;}}
  H.label=label||'';H.t=now;S.touched=true;updateUndoUI();
}
function undo(){if(H.i>0){H.i--;S.design=JSON.parse(H.stack[H.i]);afterHistory();}}
function redo(){if(H.i<H.stack.length-1){H.i++;S.design=JSON.parse(H.stack[H.i]);afterHistory();}}
function afterHistory(){if(!selEl())S.sel=null;renderInspector();requestRender();updateUndoUI();ensureUsedFonts();}
function updateUndoUI(){const u=$('#btnUndo'),r=$('#btnRedo');if(u)u.disabled=H.i<=0;if(r)r.disabled=H.i>=H.stack.length-1;}

/* ===== Ảnh mẫu & ảnh khách ===== */
const imgCache=new Map(),baseCache=new Map();
function getImg(src){
  let r=imgCache.get(src);
  if(!r){r={el:new Image(),ok:false};r.el.crossOrigin='anonymous';r.el.onload=()=>{r.ok=true;baseCache.clear();requestRender();};r.el.onerror=()=>{r.bad=true;};r.el.src=src;imgCache.set(src,r);}
  return r.ok?r.el:null;
}
function loadFileImage(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{URL.revokeObjectURL(url);res(im);};
    im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('bad image'));};
    im.src=url;
  });
}
function downscale(im,max){
  const w0=im.naturalWidth||im.width,h0=im.naturalHeight||im.height,s=Math.min(1,max/Math.max(w0,h0,1));
  const c=mkCanvas(w0*s||1,h0*s||1);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c;
}
function imgStats(c){
  const x=c.getContext('2d',{willReadFrequently:true}),d=x.getImageData(0,0,c.width,c.height).data;
  let n=0,tr=0,sum=0,ext=0;
  for(let i=0;i<d.length;i+=4){n++;if(d[i+3]<250)tr++;const l=(.299*d[i]+.587*d[i+1]+.114*d[i+2])/255;sum+=l;if(l<.2||l>.8)ext++;}
  return{alpha:tr/n>.02,mean:sum/n,ext:ext/n};
}
async function addUserImage(file){
  const im=await loadFileImage(file);
  const cv=downscale(im,1024),st=imgStats(cv),id=uid();
  imgs.set(id,{cv,ok:true,w:cv.width,h:cv.height,st});
  return{id,cv,st};
}
function loadDataUrlImage(url){
  return new Promise((res,rej)=>{const im=new Image();im.crossOrigin='anonymous';im.onload=()=>res(im);im.onerror=()=>rej(new Error('bad image'));im.src=url;});
}
const leatherTexCache=new Map(); // leather.id -> {src,tile}
function getLeatherTexTile(leather){
  if(!leather||!leather.img)return null;
  const c=leatherTexCache.get(leather.id);
  if(c&&c.src===leather.img)return c.tile;
  loadLeatherTex(leather);
  return null;
}
async function loadLeatherTex(leather){
  const entry={src:leather.img,tile:null};
  leatherTexCache.set(leather.id,entry);
  try{
    const im=await loadDataUrlImage(leather.img);
    const tile=downscale(im,900);
    if(leatherTexCache.get(leather.id)===entry){entry.tile=tile;baseCache.clear();requestRender();scheduleSim();}
  }catch(e){}
}
const motifSrcCache=new Map();
async function ensureMotifImg(motif){
  const key='m:'+motif.id;
  if(motifSrcCache.get(motif.id)===motif.img&&imgs.has(key))return key;
  const im=await loadDataUrlImage(motif.img);
  const cv=downscale(im,900),st=imgStats(cv);
  imgs.set(key,{cv,ok:true,w:cv.width,h:cv.height,st});
  motifSrcCache.set(motif.id,motif.img);
  return key;
}
const maskCache=new Map();
function getMask(el){
  const u=imgs.get(el.img);if(!u)return null;
  const key=[el.img,el.mode,el.thr,el.invert?1:0].join('|');
  let m=maskCache.get(key);if(m)return m;
  m=buildMask(u,el);maskCache.set(key,m);
  if(maskCache.size>18)maskCache.delete(maskCache.keys().next().value);
  return m;
}
function buildMask(u,el){
  const w=u.cv.width,h=u.cv.height;
  const p=u.cv.getContext('2d',{willReadFrequently:true}).getImageData(0,0,w,h).data;
  const out=mkCanvas(w,h),oc=out.getContext('2d'),od=oc.createImageData(w,h),q=od.data;
  const thr=el.thr/100,inv=!!el.invert,g=1.9-1.4*thr;
  for(let i=0;i<p.length;i+=4){
    const a=p[i+3]/255,l=(.299*p[i]+.587*p[i+1]+.114*p[i+2])/255,lc=l*a+(1-a);let b;
    if(el.mode==='sil')b=a;
    else if(el.mode==='logo'){const t=smooth(thr-.1,thr+.1,lc);b=inv?t*a:1-t;}
    else{b=Math.pow(inv?lc*a:1-lc,g);}
    q[i+3]=Math.round(clamp(b,0,1)*255);
  }
  oc.putImageData(od,0,0);return out;
}
function newImageEl(side,id,u){
  const asp=u.h/u.w;
  let w=Math.min(side.w*.35,side.h*.55/asp);if(!(w>10))w=Math.max(20,side.w*.25);
  const st=u.st;let mode=st.alpha?'sil':(st.ext>.85?'logo':'photo');
  return{id:uid(),type:'image',img:id,x:side.w/2,y:side.h/2,rot:0,w:w,h:w*asp,asp:asp,mode:mode,thr:mode==='logo'?55:50,invert:(mode!=='sil'&&st.mean<.4),depth:.9};
}

/* ===== Vẽ sản phẩm & hiệu ứng khắc laser ===== */
const tmpPool={};
function tmp(name,w,h){
  let c=tmpPool[name];
  if(!c){c=tmpPool[name]=mkCanvas(w,h);}
  else if(c.width!==w||c.height!==h){c.width=w;c.height=h;}
  else c.getContext('2d').clearRect(0,0,w,h);
  return c;
}
function colorize(img,W,H,hex,texTile){
  const c=mkCanvas(W,H),x=c.getContext('2d',{willReadFrequently:true});
  x.drawImage(img,0,0,W,H);
  let d;try{d=x.getImageData(0,0,W,H);}catch(e){return c;} // ảnh tải chéo domain chưa bật CORS: trả ảnh gốc thay vì vỡ trang
  const p=d.data;let sum=0,n=0;
  for(let i=0;i<p.length;i+=4){if(p[i+3]>200){sum+=.299*p[i]+.587*p[i+1]+.114*p[i+2];n++;}}
  const mean=Math.max((n?sum/n:128)/255,.05),cc=hexRGB(hex);
  let tp=null;
  if(texTile){
    try{
      const tc=mkCanvas(W,H),tx=tc.getContext('2d',{willReadFrequently:true});
      const pat=tx.createPattern(texTile,'repeat');tx.fillStyle=pat;tx.fillRect(0,0,W,H);
      tp=tx.getImageData(0,0,W,H).data;
    }catch(e){tp=null;}
  }
  for(let i=0;i<p.length;i+=4){
    if(!p[i+3])continue;
    const l=(.299*p[i]+.587*p[i+1]+.114*p[i+2])/255;
    let k=l/mean;k=k<1?Math.pow(k,1.05):1+(k-1)*.55;k=Math.min(k,1.7);
    if(tp){p[i]=Math.min(255,tp[i]*k);p[i+1]=Math.min(255,tp[i+1]*k);p[i+2]=Math.min(255,tp[i+2]*k);}
    else{p[i]=Math.min(255,cc[0]*k);p[i+1]=Math.min(255,cc[1]*k);p[i+2]=Math.min(255,cc[2]*k);}
  }
  x.putImageData(d,0,0);return c;
}
function getBase(side,leather){
  const raw=side.recolor===false,hex=leather.hex;
  const tile=raw?null:getLeatherTexTile(leather);
  const key=side.id+'|'+(raw?'raw':hex+'|'+(leather.img||''))+'|'+side.img.length;
  let b=baseCache.get(key);if(b)return b;
  const im=getImg(side.img);if(!im)return null;
  if(raw){b=mkCanvas(side.w,side.h);b.getContext('2d').drawImage(im,0,0,side.w,side.h);}
  else b=colorize(im,side.w,side.h,hex,tile);
  baseCache.set(key,b);
  if(baseCache.size>24)baseCache.delete(baseCache.keys().next().value);
  return b;
}
let grainCv=null;
function grainTile(){
  if(grainCv)return grainCv;
  const c=mkCanvas(160,160),x=c.getContext('2d'),d=x.createImageData(160,160);
  for(let i=0;i<d.data.length;i+=4){
    const dark=Math.random()<.55,v=dark?0:255;
    d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=Math.random()*(dark?46:34);
  }
  x.putImageData(d,0,0);grainCv=c;return c;
}
function burnColor(hex){
  const c=hexRGB(hex),L=lumHex(hex);
  if(L<.17)return rgbHex(mix(c,[198,180,162],.62));
  return rgbHex(mix(c,[12,6,3],.55+.2*Math.min(L,.6)/.6));
}
const HAS_LS=(function(){try{return 'letterSpacing' in mkCanvas(2,2).getContext('2d');}catch(e){return false;}})();
function setLS(ctx,el){if(HAS_LS)ctx.letterSpacing=(el.ls/100*el.size)+'px';}
function fontStr(el){return (el.italic?'italic ':'')+(el.bold?'700 ':'400 ')+el.size+'px "'+el.font+'", "Be Vietnam Pro", sans-serif';}
const mctx=mkCanvas(4,4).getContext('2d');
function textW(ctx,t,el){const w=ctx.measureText(t).width;return HAS_LS?w:w+t.length*el.ls/100*el.size;}
function bbox(el){
  if(el.type==='image')return{w:el.w,h:el.h};
  mctx.font=fontStr(el);setLS(mctx,el);
  const ls=String(el.text||'').split('\n');let w=0;
  ls.forEach(t=>{w=Math.max(w,textW(mctx,t,el));});
  return{w:Math.max(w,el.size*.6),h:Math.max(ls.length*el.size*el.lh,el.size)};
}
function drawTextEl(ec,el){
  ec.font=fontStr(el);setLS(ec,el);ec.textBaseline='middle';ec.textAlign='left';ec.fillStyle='#000';
  const ls=String(el.text||'').split('\n'),b=bbox(el),lh=el.size*el.lh;
  ls.forEach((t,i)=>{
    const w=textW(ec,t,el);
    const x=el.align==='left'?-b.w/2:el.align==='right'?b.w/2-w:-w/2;
    const y=(i-(ls.length-1)/2)*lh;
    if(HAS_LS||!el.ls)ec.fillText(t,x,y);
    else{let cx=x;for(const ch of t){ec.fillText(ch,cx,y);cx+=ec.measureText(ch).width+el.ls/100*el.size;}}
  });
}
function drawEl(ec,el){
  ec.save();ec.translate(el.x,el.y);ec.rotate(rad(el.rot));ec.globalAlpha=clamp(el.depth,.2,1);
  if(el.type==='text'){needFont(el);drawTextEl(ec,el);}
  else{const m=getMask(el);if(m)ec.drawImage(m,-el.w/2,-el.h/2,el.w,el.h);}
  ec.restore();
}
function drawEngraving(pc,side,els,hex,k){
  const PW=pc.canvas.width,PH=pc.canvas.height;
  const eng=tmp('eng',PW,PH),ec=eng.getContext('2d');
  ec.save();ec.setTransform(k,0,0,k,0,0);
  ec.beginPath();ec.rect(0,0,side.w,side.h);ec.clip();
  els.forEach(el=>drawEl(ec,el));ec.restore();
  if(!els.length)return;
  const paint=(color,alpha,dx,dy)=>{
    const t=tmp('tint',PW,PH),tc=t.getContext('2d');
    tc.drawImage(eng,0,0);tc.globalCompositeOperation='source-in';tc.fillStyle=color;tc.fillRect(0,0,PW,PH);tc.globalCompositeOperation='source-over';
    pc.save();pc.globalCompositeOperation='source-atop';pc.globalAlpha=alpha;pc.drawImage(t,dx,dy);pc.restore();
  };
  paint('#ffffff',.24,k*1.3,k*1.3);
  paint(burnColor(hex),.94,0,0);
  const t2=tmp('edge',PW,PH),c2=t2.getContext('2d');
  c2.drawImage(eng,0,0);c2.globalCompositeOperation='destination-out';c2.drawImage(eng,k*1.4,k*1.4);
  c2.globalCompositeOperation='source-in';c2.fillStyle='#000';c2.fillRect(0,0,PW,PH);
  pc.save();pc.globalCompositeOperation='source-atop';pc.globalAlpha=.42;pc.drawImage(t2,0,0);pc.restore();
}
/* Vẽ một mặt sản phẩm lên ctx (toạ độ điểm ảnh thật). Trả false nếu ảnh mẫu chưa tải xong. */
function drawSide(ctx,side,els,leather,k,opts){
  opts=opts||{};
  const base=getBase(side,leather);if(!base)return false;
  const pad=PAD(side),PW=Math.round(side.w*k),PH=Math.round(side.h*k);
  const prodC=tmp('prod',PW,PH),pc=prodC.getContext('2d');
  pc.drawImage(base,0,0,PW,PH);
  if(side.recolor!==false){
    try{
      const pat=pc.createPattern(grainTile(),'repeat');
      if(pat.setTransform)pat.setTransform(new DOMMatrix([k*1.1,0,0,k*1.1,0,0]));
      pc.save();pc.globalCompositeOperation='source-atop';pc.fillStyle=pat;pc.fillRect(0,0,PW,PH);pc.restore();
    }catch(e){}
  }
  drawEngraving(pc,side,els,leather.hex,k);
  ctx.save();
  if(opts.shadow!==false){ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=22*k;ctx.shadowOffsetY=10*k;}
  ctx.drawImage(prodC,Math.round(pad*k),Math.round(pad*k),PW,PH);
  ctx.restore();
  return true;
}

/* ===== Khung xem (canvas) ===== */
const cv=()=>$('#cv');
let raf=0,guides={v:false,h:false};
function requestRender(){if(!raf)raf=requestAnimationFrame(renderStage);}
function fit(){
  const st=$('#stage'),side=curSide(),c=cv();if(!st||!side||!c)return;
  const pad=PAD(side),W=side.w+2*pad,H=side.h+2*pad,cs=getComputedStyle(st);
  const aw=Math.max(60,st.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight));
  const ah=Math.max(60,st.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-14);
  let s=Math.min(aw/W,ah/H);s=Math.min(s,1.7);
  const dpr=Math.min(window.devicePixelRatio||1,2.5);
  view.cs=s;view.k=Math.min(s*dpr,4096/Math.max(W,H));
  c.style.width=Math.round(W*s)+'px';c.style.height=Math.round(H*s)+'px';
  const bw=Math.round(W*view.k),bh=Math.round(H*view.k);
  if(c.width!==bw||c.height!==bh){c.width=bw;c.height=bh;}
}
function renderStage(){
  raf=0;
  if(VIEW!=='design')return;
  const side=curSide(),c=cv(),p=prod();if(!c)return;
  const ctx=c.getContext('2d');ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,c.width,c.height);
  if(!side||!p){return;}
  const lea=leatherOf(p),k=view.k,pad=PAD(side);
  const ok=drawSide(ctx,side,elsNow(),lea,k,{shadow:true});
  $('#loading').hidden=!!ok;
  if(!ok)return;
  drawOverlay(ctx,side,k,pad);
}
function drawOverlay(ctx,side,k,pad){
  const cs=view.cs,px=1/cs;
  ctx.save();ctx.setTransform(k,0,0,k,pad*k,pad*k);
  if(guides.v||guides.h){
    const cx=side.w/2,cy=side.h/2;
    ctx.strokeStyle='rgba(255,120,110,.9)';ctx.lineWidth=1.2*px;ctx.beginPath();
    if(guides.v){ctx.moveTo(cx,-8*px);ctx.lineTo(cx,side.h+8*px);}
    if(guides.h){ctx.moveTo(-8*px,cy);ctx.lineTo(side.w+8*px,cy);}
    ctx.stroke();
  }
  const el=selEl();
  if(el){
    const b=bbox(el),hw=b.w/2+4*px,hh=b.h/2+4*px;
    ctx.translate(el.x,el.y);ctx.rotate(rad(el.rot));
    ctx.strokeStyle='#e2bd7c';ctx.lineWidth=1.6*px;ctx.strokeRect(-hw,-hh,hw*2,hh*2);
    ctx.beginPath();ctx.moveTo(0,-hh);ctx.lineTo(0,-hh-26*px);ctx.stroke();
    const dot=(x,y,r,fill)=>{ctx.beginPath();ctx.arc(x,y,r*px,0,7);ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle='#15110a';ctx.lineWidth=1.6*px;ctx.stroke();};
    dot(0,-hh-26*px,8,'#e2bd7c');dot(hw,hh,8,'#e2bd7c');
  }
  ctx.restore();
}

/* ===== Thao tác chuột/cảm ứng ===== */
const ptrs=new Map();let G=null;
function evPoint(e){
  const c=cv(),r=c.getBoundingClientRect(),side=curSide(),pad=PAD(side),cs=r.width/(side.w+2*pad);
  return{x:(e.clientX-r.left)/cs-pad,y:(e.clientY-r.top)/cs-pad,cs:cs};
}
function toLocal(el,x,y){const dx=x-el.x,dy=y-el.y,c=Math.cos(-rad(el.rot)),s=Math.sin(-rad(el.rot));return{x:dx*c-dy*s,y:dx*s+dy*c};}
function hitEl(el,p,tol){const l=toLocal(el,p.x,p.y),b=bbox(el);tol=tol||0;return Math.abs(l.x)<=b.w/2+tol&&Math.abs(l.y)<=b.h/2+tol;}
function handleHit(el,p,touch){
  const l=toLocal(el,p.x,p.y),b=bbox(el),px=1/p.cs,r=(touch?24:15)*px;
  const hw=b.w/2+4*px,hh=b.h/2+4*px;
  if(Math.hypot(l.x-hw,l.y-hh)<=r)return'scale';
  if(Math.hypot(l.x,l.y-(-hh-26*px))<=r)return'rot';
  return null;
}
function selectEl(id){
  if(S.sel===id)return;S.sel=id;S.fontOpen=false;renderInspector();requestRender();
}
function patch(el,o){Object.assign(el,o);}
function onDown(e){
  const side=curSide();if(!side)return;
  const c=cv();c.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  hideNote();
  const el=selEl();
  if(ptrs.size===2&&el){startPinch(el);return;}
  if(ptrs.size>1)return;
  const p=evPoint(e),touch=e.pointerType==='touch';
  if(el){
    const h=handleHit(el,p,touch);
    if(h){G={type:h,el:el,p0:p,x0:el.x,y0:el.y,size0:el.size,w0:el.w,rot0:el.rot,d0:Math.hypot(p.x-el.x,p.y-el.y)||1,a0:Math.atan2(p.y-el.y,p.x-el.x)};e.preventDefault();return;}
  }
  const list=elsNow();
  for(let i=list.length-1;i>=0;i--){
    if(hitEl(list[i],p,touch?10/p.cs:2/p.cs)){
      selectEl(list[i].id);const t=list[i];
      G={type:'move',el:t,p0:p,x0:t.x,y0:t.y,moved:false};e.preventDefault();return;
    }
  }
  selectEl(null);G=null;
}
function startPinch(el){
  const a=Array.from(ptrs.values()),c=cv().getBoundingClientRect();
  const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1,ang=Math.atan2(a[1].y-a[0].y,a[1].x-a[0].x);
  G={type:'pinch',el:el,d0:d,a0:ang,mid0:{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2},x0:el.x,y0:el.y,size0:el.size,w0:el.w,rot0:el.rot,cs:c.width?c.getBoundingClientRect().width/(curSide().w+2*PAD(curSide())):1};
}
function applyScale(el,ratio,g){
  if(el.type==='text'){el.size=Math.round(clamp(g.size0*ratio,6,1200)*10)/10;}
  else{el.w=clamp(g.w0*ratio,10,curSide().w*3);el.h=el.w*el.asp;}
}
function onMove(e){
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const side=curSide();if(!side)return;
  if(!G){hoverCursor(e);return;}
  const el=G.el;
  if(G.type==='pinch'&&ptrs.size>=2){
    const a=Array.from(ptrs.values()),d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1,ang=Math.atan2(a[1].y-a[0].y,a[1].x-a[0].x);
    applyScale(el,d/G.d0,G);
    let r=G.rot0+deg(ang-G.a0);r=((r+540)%360)-180;el.rot=Math.round(r*10)/10;
    el.x=G.x0+((a[0].x+a[1].x)/2-G.mid0.x)/G.cs;el.y=G.y0+((a[0].y+a[1].y)/2-G.mid0.y)/G.cs;
    requestRender();return;
  }
  if(ptrs.size>1)return;
  const p=evPoint(e);
  if(G.type==='move'){
    let nx=G.x0+p.x-G.p0.x,ny=G.y0+p.y-G.p0.y;
    const zc={x:side.w/2,y:side.h/2},th=7/p.cs;
    guides.v=Math.abs(nx-zc.x)<th;guides.h=Math.abs(ny-zc.y)<th;
    if(guides.v)nx=zc.x;if(guides.h)ny=zc.y;
    el.x=clamp(nx,0,side.w);el.y=clamp(ny,0,side.h);G.moved=true;
  }else if(G.type==='scale'){
    applyScale(el,(Math.hypot(p.x-el.x,p.y-el.y)||1)/G.d0,G);
  }else if(G.type==='rot'){
    let r=G.rot0+deg(Math.atan2(p.y-el.y,p.x-el.x)-G.a0);r=((r+540)%360)-180;
    const s=Math.round(r/45)*45;if(Math.abs(r-s)<3)r=s;el.rot=Math.round(r*10)/10;
  }
  requestRender();
}
function onUp(e){
  ptrs.delete(e.pointerId);
  if(G&&G.type==='pinch'&&ptrs.size<2){commit();G=null;guides={v:false,h:false};refreshProps();requestRender();return;}
  if(ptrs.size===0&&G){
    const changed=G.type!=='move'||G.moved;
    G=null;guides={v:false,h:false};
    if(changed){commit();refreshProps();}
    requestRender();
  }
}
function hoverCursor(e){
  if(e.pointerType==='touch')return;
  const side=curSide();if(!side)return;
  const p=evPoint(e),el=selEl(),c=cv();let cur='default';
  if(el){const h=handleHit(el,p,false);if(h)cur=h==='scale'?'nwse-resize':'grab';}
  if(cur==='default'){const l=elsNow();for(let i=l.length-1;i>=0;i--){if(hitEl(l[i],p,2/p.cs)){cur='move';break;}}}
  c.style.cursor=cur;
}

function slider(k,label,min,max,step,val,out){

function fmtVal(k,el){
  const s=curSide(),m=s?mmPerPx(s):0;
  if(k==='size')return m?(Math.round(el.size*m*2)/2+' mm'):Math.round(el.size)+' px';
  if(k==='w')return m?(Math.round(el.w*m*2)/2+' mm'):Math.round(el.w)+' px';

function refreshProps(){
  const el=selEl();if(!el)return;
  $$('#inspector [data-k]').forEach(i=>{
    const k=i.dataset.k;if(k==='text'||document.activeElement===i)return;
    if(el[k]!==undefined)i.value=el[k];
  });
  $$('#inspector [data-out]').forEach(o=>{o.textContent=fmtVal(o.dataset.out,el);});
}
function bindInspector(){
  const box=$('#inspector');
  box.addEventListener('click',e=>{
    const t=e.target.closest('button');if(!t)return;
    const el=selEl();
    if(t.dataset.sel){selectEl(t.dataset.sel);return;}
    if(t.id==='fontToggle'){S.fontOpen=!S.fontOpen;renderInspector();return;}
    if(t.dataset.cat){S.fontCat=t.dataset.cat;renderInspector();return;}
    if(t.dataset.font&&el){el.font=t.dataset.font;commit();renderInspector();requestRender();ensureUsedFonts();return;}
    if(t.dataset.toggle&&el){el[t.dataset.toggle]=!el[t.dataset.toggle];commit();renderInspector();requestRender();ensureUsedFonts();return;}
    if(t.dataset.rot!==undefined&&el){if(t.dataset.rot==='reset')el.rot=0;else{const r=el.rot+parseFloat(t.dataset.rot);el.rot=((r+540)%360)-180;}commit();renderInspector();requestRender();return;}
    if(t.dataset.set&&el){const a=t.dataset.set.split(':');el[a[0]]=a[1];commit();renderInspector();requestRender();return;}
    if(t.dataset.act){const a=t.dataset.act;if(a==='del')delSel();else if(a==='dup')dupSel();else if(a==='up')moveLayer(1);else if(a==='down')moveLayer(-1);}
  });
  box.addEventListener('input',e=>{
    const i=e.target,k=i.dataset&&i.dataset.k,el=selEl();if(!k||!el)return;
    if(k==='text'){el.text=i.value;commit('t:'+el.id);const b=$('[data-sel="'+el.id+'"] span');if(b)b.textContent=firstLine(el.text)||'(trống)';const fc=$('#fontToggle span');if(fc)fc.textContent=firstLine(el.text).slice(0,18)||'Aa';ensureUsedFonts();requestRender();return;}
    const v=parseFloat(i.value);
    if(k==='w'){el.w=v;el.h=v*el.asp;}else el[k]=v;
    const o=$('[data-out="'+k+'"]');if(o)o.textContent=fmtVal(k,el);
    commit('k:'+el.id+k);requestRender();
  });
}

const SIMS=new Set();let simRaf=0;
function scheduleSim(){if(!simRaf&&SIMS.size)simRaf=requestAnimationFrame(()=>{simRaf=0;SIMS.forEach(c=>{if(!c.isConnected){SIMS.delete(c);return;}drawSim(c);});});}
function simEls(W,H){
  const b=(S.data.brand||'Davis').toUpperCase();
  return[
   {id:'sim1',type:'text',x:W/2,y:H*.44,rot:0,text:'Minh Anh',font:'Great Vibes',size:Math.round(H*.27),bold:false,italic:false,align:'center',ls:0,lh:1.15,depth:.93},
   {id:'sim2',type:'text',x:W/2,y:H*.71,rot:0,text:'HANDMADE · '+b,font:'Montserrat',size:Math.round(H*.064),bold:false,italic:false,align:'center',ls:28,lh:1.15,depth:.86}
  ];
}
function drawSim(c){
  const l=leatherById(c.dataset.sim);if(!l)return;
  const W=c.width,H=c.height,x=c.getContext('2d');
  x.setTransform(1,0,0,1,0,0);x.globalCompositeOperation='source-over';x.globalAlpha=1;
  x.fillStyle=l.hex;x.fillRect(0,0,W,H);
  const tile=getLeatherTexTile(l);
  if(tile){try{x.fillStyle=x.createPattern(tile,'repeat');x.fillRect(0,0,W,H);}catch(e){}}
  else{try{const p=x.createPattern(grainTile(),'repeat');x.save();x.globalAlpha=.9;x.fillStyle=p;x.fillRect(0,0,W,H);x.restore();}catch(e){}}
  const g=x.createRadialGradient(W*.32,H*.2,0,W*.5,H*.55,Math.max(W,H)*.8);
  g.addColorStop(0,'rgba(255,255,255,.11)');g.addColorStop(.55,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.32)');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  drawEngraving(x,{w:W,h:H},simEls(W,H),l.hex,1);
}
function hydrateSims(root){$$('canvas[data-sim]',root).forEach(c=>{SIMS.add(c);drawSim(c);});ensureFontsFor(simEls(600,360)).then(scheduleSim);}
function simCard(l,on){
  return '<button class="simc'+(on?' on':'')+'" data-gl="'+esc(l.id)+'" title="Xem bộ sưu tập da '+esc(l.name)+'"><canvas data-sim="'+esc(l.id)+'" width="600" height="360" aria-label="Mô phỏng nét khắc trên da '+esc(l.name)+'"></canvas><span>'+esc(l.name)+'<small>Mô phỏng</small></span></button>';
}
function simPicks(n){
  const L=S.data.leathers.slice().sort((a,b)=>lumHex(b.hex)-lumHex(a.hex));
  if(L.length<=n)return L;
  const out=[];for(let i=0;i<n;i++){const l=L[Math.round(i*(L.length-1)/(n-1))];if(!out.includes(l))out.push(l);}
  return out;
}
function heroLeather(){
  const L=S.data.leathers;
  return L.find(l=>l.img)||L.slice().sort((a,b)=>Math.abs(lumHex(a.hex)-.3)-Math.abs(lumHex(b.hex)-.3))[0];
}
function ytEmbed(u){
  u=String(u||'').trim();if(!u)return'';
  let m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([\w-]{11})/i);
  if(m)return'https://www.youtube-nocookie.com/embed/'+m[1]+'?rel=0';
  return'';
}

const pad2=n=>String(n).padStart(2,'0');

/* ===== Xuất ảnh ===== */
function describeEls(side,els){
  const m=mmPerPx(side),out=[];
  els.forEach(e=>{
    if(e.type==='text'){
      let s='“'+String(e.text||'').split('\n').filter(x=>x.trim()).join(' / ')+'” · '+e.font+(e.bold?', đậm':'')+(e.italic?', nghiêng':'');
      if(m)s+=' · cao khoảng '+(Math.round(e.size*m*2)/2)+' mm';
      if(Math.round(e.rot))s+=' · xoay '+Math.round(e.rot)+'°';
      out.push(s);
    }else{
      let s='Hình khách tải lên · '+MODE_NAME[e.mode];
      if(m)s+=' · rộng khoảng '+(Math.round(e.w*m*2)/2)+' mm';
      if(Math.round(e.rot))s+=' · xoay '+Math.round(e.rot)+'°';
      out.push(s);
    }
  });
  return out;
}
function wrapText(ctx,text,maxW){
  const words=String(text).split(/\s+/),lines=[];let cur='';
  words.forEach(w=>{const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;});
  if(cur)lines.push(cur);return lines.length?lines:[''];
}
async function buildSheet(opt){
  const p=prod(),d=dsg(p.id),cs=curSide();
  const sides=opt.all?validSides(p):[cs];
  await Promise.all(sides.map(s=>whenImg(s.img)));
  const all=[];sides.forEach(s=>d.sides[s.id].forEach(e=>all.push(e)));
  await ensureFontsFor(all);
  const lea=leatherOf(p),K=2;
  const parts=sides.map(s=>{const pd=PAD(s),c=mkCanvas((s.w+2*pd)*K,(s.h+2*pd)*K);drawSide(c.getContext('2d'),s,d.sides[s.id],lea,K,{shadow:true});return{s:s,c:c};});
  const W=1600,M=64,inner=W-2*M;
  const C={bg:'#f3f1ee',tx:'#1d1f21',mu:'#6d6b66',ln:'#dcd8d2',br:'#a27b36'};
  const F='"Be Vietnam Pro",system-ui,sans-serif';
  /* bố cục */
  const rows=[['Mã sản phẩm',p.code+' — '+p.name],['Màu da',lea.name],['Ngày thiết kế',fmtDate(new Date())]];
  mctx.font='400 24px '+F;mctx.letterSpacing='0px';
  const eng=[];
  sides.forEach(s=>{
    const list=describeEls(s,d.sides[s.id]);
    const z=s.mm&&s.mm.w?' · kích thước thật '+Math.round(s.mm.w)+' × '+Math.round(s.mm.h)+' mm':'';
    eng.push({head:s.label+z,lines:list.length?list.map(t=>wrapText(mctx,t,inner-40)):[['(Không có nội dung khắc)']]});
  });
  const noteLines=opt.note&&opt.note.trim()?wrapText(mctx,opt.note.trim(),inner-40):null;
  let infoH=0;
  if(opt.notes){
    infoH=36+rows.length*38+16;
    eng.forEach(g=>{infoH+=46;g.lines.forEach(l=>{infoH+=l.length*32+6;});});
    if(noteLines)infoH+=46+noteLines.length*32;
    infoH+=30;
  }
  const headH=opt.notes?120:0;
  let y=headH+(opt.notes?0:M);
  const blocks=parts.map(({s,c})=>{
    const asp=c.height/c.width,w=Math.min(inner,1000/asp),h=w*asp;
    const b={s:s,c:c,w:w,h:h,y:0};return b;
  });
  let total=y+infoH+40;
  blocks.forEach(b=>{b.y=total+44;total=b.y+b.h+36;});
  const footH=opt.notes?110:M;
  const H=Math.round(total+footH);
  const out=mkCanvas(W,H),x=out.getContext('2d');
  x.fillStyle=C.bg;x.fillRect(0,0,W,H);
  x.textBaseline='alphabetic';
  if(opt.notes){
    x.fillStyle='#16181a';x.fillRect(0,0,W,headH);
    x.fillStyle='#f1eee9';x.font='600 46px "Playfair Display",Georgia,serif';try{x.letterSpacing='12px';}catch(e){}
    x.fillText('DAVIS',M,74);try{x.letterSpacing='2px';}catch(e){}
    x.textAlign='right';x.fillStyle='#c8a15b';x.font='600 20px '+F;x.fillText('BẢN THIẾT KẾ KHẮC LASER',W-M,60);
    x.fillStyle='#9ba1a6';x.font='400 18px '+F;x.fillText((S.data.contact&&S.data.contact.web)||'davis.vn',W-M,88);
    x.textAlign='left';try{x.letterSpacing='0px';}catch(e){}
    let ty=headH+52;
    rows.forEach(r=>{
      x.fillStyle=C.mu;x.font='500 20px '+F;x.fillText(r[0].toUpperCase(),M,ty);
      x.fillStyle=C.tx;x.font='500 26px '+F;x.fillText(r[1],M+300,ty);ty+=38;
    });
    ty+=8;
    eng.forEach(g=>{
      x.strokeStyle=C.ln;x.lineWidth=2;x.beginPath();x.moveTo(M,ty-24);x.lineTo(W-M,ty-24);x.stroke();
      x.fillStyle=C.br;x.font='600 22px '+F;x.fillText(g.head.toUpperCase(),M,ty+8);ty+=46;
      x.font='400 24px '+F;
      g.lines.forEach((l,i)=>{l.forEach((t,j)=>{x.fillStyle=C.tx;x.fillText((j===0?'•  ':'    ')+t,M+8,ty);ty+=32;});ty+=6;});
    });
    if(noteLines){
      x.strokeStyle=C.ln;x.beginPath();x.moveTo(M,ty-24);x.lineTo(W-M,ty-24);x.stroke();
      x.fillStyle=C.br;x.font='600 22px '+F;x.fillText('LỜI NHẮN CỦA KHÁCH',M,ty+8);ty+=46;
      x.font='400 24px '+F;x.fillStyle=C.tx;noteLines.forEach(t=>{x.fillText(t,M+8,ty);ty+=32;});
    }
  }
  blocks.forEach(b=>{
    x.fillStyle=C.mu;x.font='600 22px '+F;try{x.letterSpacing='2px';}catch(e){}
    x.fillText(b.s.label.toUpperCase(),M,b.y-16);try{x.letterSpacing='0px';}catch(e){}
    x.drawImage(b.c,Math.round((W-b.w)/2),Math.round(b.y),Math.round(b.w),Math.round(b.h));
  });
  if(opt.notes){
    x.fillStyle=C.mu;x.font='400 20px '+F;
    x.fillText('Bản thiết kế do khách tự tạo để tham khảo ý tưởng. Nhân viên Davis sẽ tinh chỉnh bố cục và xác nhận lại trước khi khắc.',M,H-52);
    x.fillText('Màu sắc và vết khắc trên ảnh là mô phỏng, thành phẩm có thể chênh lệch nhẹ.',M,H-24);
  }
  return out;
}
const zaloLink=c=>{const z=((c&&c.zalo)||'').trim();if(!z)return'';if(/^https?:/i.test(z))return z;const d=z.replace(/\D/g,'');return d?'https://zalo.me/'+d:'';};
const msgrLink=c=>{const m=((c&&c.messenger)||'').trim();if(!m)return'';if(/^https?:/i.test(m))return m;return'https://m.me/'+m.replace(/^@/,'').replace(/\s/g,'');};

function syncMm(s){if(s.mm&&s.mm.w&&s.w){s.mm.h=Math.round(s.mm.w*(s.h/s.w)*10)/10;}}
let admUnlocked=false;
function openAdmin(){
  if(FB.active){
    if(FB.user){reallyOpenAdmin();}else{promptFirebaseLogin();}
    return;
  }
  if(S.data.adminPass&&!admUnlocked){promptAdminPass();return;}
  reallyOpenAdmin();
}
function reallyOpenAdmin(){
  AD.W=clone(S.data);AD.tab='products';AD.pi=0;AD.dirty=false;AD.closing=false;AD.toDelete=[];
  const root=document.createElement('div');root.className='adm';root.id='adm';$('#modalRoot').appendChild(root);
  root.addEventListener('click',admClick);root.addEventListener('input',admInput);root.addEventListener('change',admChange);
  renderAdmin();
}
function promptFirebaseLogin(){
  const bg=openModal(
   '<div class="mh"><h2>Đăng nhập quản trị</h2><button class="ibtn sm" data-x aria-label="Đóng">'+icon('close',16)+'</button></div>'+
   '<div class="mb col"><label class="fld"><span>Email</span><input type="email" id="fbEmail" autocomplete="username"></label>'+
   '<label class="fld"><span>Mật khẩu</span><input type="password" id="fbPass" autocomplete="current-password"></label>'+
   '<p class="tip" id="fbLoginErr" hidden></p></div>'+
   '<div class="mf"><button class="btn pri" id="fbLoginOk">Đăng nhập</button></div>','sm');
  const submit=async()=>{
    const email=$('#fbEmail',bg).value.trim(),pass=$('#fbPass',bg).value;
    if(!email||!pass)return;
    const btn=$('#fbLoginOk',bg);btn.disabled=true;btn.textContent='Đang đăng nhập…';
    try{
      await fbSignIn(email,pass);
      closeModal(bg);reallyOpenAdmin();
    }catch(e){
      const err=$('#fbLoginErr',bg);if(err){err.hidden=false;err.textContent=fbFriendlyErr(e);err.style.color='var(--danger)';err.style.borderColor='var(--danger)';}
      btn.disabled=false;btn.textContent='Đăng nhập';
    }
  };
  $('#fbLoginOk',bg).addEventListener('click',submit);
  $('#fbPass',bg).addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submit();}});
  setTimeout(()=>{const el=$('#fbEmail',bg);if(el)el.focus();},30);
}
function promptAdminPass(){
  const bg=openModal(
   '<div class="mh"><h2>Mật khẩu quản trị</h2><button class="ibtn sm" data-x aria-label="Đóng">'+icon('close',16)+'</button></div>'+
   '<div class="mb col"><label class="fld"><span>Nhập mật khẩu để mở trang quản trị</span><input type="password" id="admPassIn" autocomplete="current-password"></label>'+
   '<p class="tip" id="admPassErr" hidden>Sai mật khẩu, thử lại nhé.</p></div>'+
   '<div class="mf"><button class="btn pri" id="admPassOk">Mở quản trị</button></div>','sm');
  const submit=async()=>{
    const v=$('#admPassIn',bg).value,h=await hashPass(v);
    if(h&&h===S.data.adminPass){admUnlocked=true;closeModal(bg);reallyOpenAdmin();}
    else{const err=$('#admPassErr',bg);if(err){err.hidden=false;err.style.color='var(--danger)';err.style.borderColor='var(--danger)';}$('#admPassIn',bg).select();}
  };
  $('#admPassOk',bg).addEventListener('click',submit);
  $('#admPassIn',bg).addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submit();}});
  setTimeout(()=>{const el=$('#admPassIn',bg);if(el)el.focus();},30);
}
function closeAdmin(){const r=$('#adm');if(r)r.remove();}
function markDirty(){AD.dirty=true;const s=$('#admStatus');if(s){s.textContent='Có thay đổi chưa lưu';s.classList.add('warn');}const m=$('#admMeter');if(m)updateMeter();}
function updateMeter(){
  const n=dataSize(),m=$('#admMeter');if(!m)return;
  m.querySelector('i').style.width=Math.min(100,n/MAXDATA*100)+'%';m.classList.toggle('warn',n>MAXDATA*.85);
  const t=$('#admMeterTxt');if(t)t.textContent=(n/1e6).toFixed(1)+' MB / '+(MAXDATA/1e6)+' MB';
}

       '<label class="chk"><input type="checkbox" data-as="recolor"'+(s.recolor!==false?' checked':'')+'><span>Cho khách đổi màu da trên mặt này<br><small class="muted">Tắt nếu ảnh mẫu đã là ảnh thật đúng màu bạn muốn giữ nguyên.</small></span></label>';
    }else h+='<p class="tip">Chưa có ảnh. Nên dùng ảnh sản phẩm chụp thẳng, nền trắng hoặc nền trong suốt. Ứng dụng sẽ giúp xoá nền khi bạn chọn ảnh.</p>';

function admSecurity(){
  if(FB.active){

function applyAdmin(closeAfter){
  S.data=normalizeData(clone(AD.W));
  const vp=visibleProducts();
  if(!vp.find(p=>p.id===S.pid))S.pid=vp[0]?vp[0].id:null;
  S.data.products.forEach(p=>{dsg(p.id);const d=S.design[p.id];Object.keys(d.sides).forEach(k=>{if(!p.sides.some(s=>s.id===k))delete d.sides[k];});});
  Object.keys(S.design).forEach(k=>{if(!S.data.products.some(p=>p.id===k))delete S.design[k];});
  const p=prod();if(p&&!validSides(p).find(s=>s.id===S.sid))S.sid=validSides(p)[0]?validSides(p)[0].id:null;
  S.sel=null;baseCache.clear();histReset();renderAll();renderPages();
  if(STANDALONE)saveLocal();
  if(closeAfter){closeAdmin();toast('Đây là bản xem thử. Chưa cập nhật cho khách cho đến khi bạn đăng hoặc tải bản HTML mới.');}
}
async function saveToServer(){
  if(!FB.active||AD.busy)return;
  if(!FB.user){toast('Bạn cần đăng nhập lại.');promptFirebaseLogin();return;}
  AD.busy=true;renderAdmin();
  try{
    const W=AD.W;
    for(const p of W.products){
      for(const s of p.sides){
        if(s.img&&s.img.indexOf('data:')===0)s.img=await fbUploadDataUrl(s.img,'products/'+p.id+'/'+s.id);
      }
    }
    for(const m of(W.motifs||[])){
      if(m.img&&m.img.indexOf('data:')===0)m.img=await fbUploadDataUrl(m.img,'motifs/'+m.id);
    }
    const upl=new Set();
    for(const l of W.leathers){
      if(l.img&&l.img.indexOf('data:')===0){l.img=await fbUploadDataUrl(l.img,'leathers/'+l.id);upl.add('leathers/'+l.id);}
    }
    for(const g of(W.gallery||[])){
      if(g.img&&g.img.indexOf('data:')===0){g.img=await fbUploadDataUrl(g.img,'gallery/'+g.id);upl.add('gallery/'+g.id);}
    }
    if(W.intro&&W.intro.img&&W.intro.img.indexOf('data:')===0){W.intro.img=await fbUploadDataUrl(W.intro.img,'intro/hero');upl.add('intro/hero');}
    W.products.forEach(p=>p.sides.forEach(s=>upl.add('products/'+p.id+'/'+s.id)));
    (W.motifs||[]).forEach(m=>upl.add('motifs/'+m.id));
    for(const path of AD.toDelete||[]){if(!upl.has(path))await fbDeletePath(path);}
    AD.toDelete=[];
    W.savedAt=Date.now();
    await fbSaveCatalog(W);
    AD.dirty=false;
    applyAdmin(false);
    toast('Đã lưu lên máy chủ. Khách mở trang sẽ thấy ngay.');
  }catch(e){
    toast('Lưu chưa thành công: '+fbFriendlyErr(e));
  }
  AD.busy=false;if($('#adm'))renderAdmin();
}
async function publishSite(){
  if(!CAP.artifact||AD.busy)return;
  const W=AD.W;W.savedAt=Date.now();
  const html=buildDoc(W);
  if(html.length>15.5e6){toast('Dữ liệu quá lớn để đăng. Hãy xoá bớt mẫu hoặc ảnh.');return;}
  AD.busy=true;renderAdmin();
  try{await CAP.artifact.publish(html);AD.dirty=false;toast('Đã đăng. Trang sẽ tải lại với mẫu mới.');}
  catch(e){
    const c=e&&e.code,msg={not_writer:'Tài khoản này không có quyền chỉnh sửa trang.',not_granted:'Tài khoản này không có quyền chỉnh sửa trang.',too_large:'Dữ liệu quá lớn để đăng. Hãy xoá bớt mẫu hoặc ảnh.',conflict:'Vừa có bản khác được đăng trước. Trang sẽ tải lại, hãy thử làm lại thay đổi.',rate_limited:'Bạn đăng quá nhanh, hãy chờ một chút rồi thử lại.'};
    toast(msg[c]||'Chưa đăng được, hãy thử lại sau ít phút.');
  }
  AD.busy=false;if($('#adm'))renderAdmin();
}

function removeBg(src,tol){
  const w=src.width,h=src.height,c=mkCanvas(w,h),x=c.getContext('2d',{willReadFrequently:true});x.drawImage(src,0,0);
  const d=x.getImageData(0,0,w,h),p=d.data;
  const cs=[0,(w-1)*4,(h-1)*w*4,(h*w-1)*4];let br=0,bg=0,bb=0;cs.forEach(o=>{br+=p[o];bg+=p[o+1];bb+=p[o+2];});br/=4;bg/=4;bb/=4;
  const T=Math.pow(tol*2.4,2),vis=new Uint8Array(w*h),st=[];
  const push=i=>{if(vis[i])return;const o=i*4,dr=p[o]-br,dg=p[o+1]-bg,db=p[o+2]-bb;if(dr*dr+dg*dg+db*db<=T){vis[i]=1;st.push(i);}};
  for(let i=0;i<w;i++){push(i);push((h-1)*w+i);}
  for(let j=0;j<h;j++){push(j*w);push(j*w+w-1);}
  while(st.length){const i=st.pop(),xx=i%w,yy=(i/w)|0;if(xx>0)push(i-1);if(xx<w-1)push(i+1);if(yy>0)push(i-w);if(yy<h-1)push(i+w);}
  for(let i=0;i<w*h;i++){
    if(vis[i]){p[i*4+3]=0;continue;}
    const xx=i%w,yy=(i/w)|0;
    if((xx>0&&vis[i-1])||(xx<w-1&&vis[i+1])||(yy>0&&vis[i-w])||(yy<h-1&&vis[i+w]))p[i*4+3]=150;
  }
  x.putImageData(d,0,0);return c;
}
function encodeImg(c,alpha){
  let u=c.toDataURL('image/webp',.88);
  if(u.indexOf('data:image/webp')!==0)u=alpha?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.9);
  return u;
}
function processUpload(file){
  return new Promise(async resolve=>{
    let im;try{im=await loadFileImage(file);}catch(e){toast('Không đọc được ảnh này.');return resolve(null);}
    const src=downscale(im,1200),st=imgStats(src);
    const bg=openModal('<div class="mh"><h2>Chuẩn bị ảnh mẫu</h2><button class="ibtn sm" data-x aria-label="Đóng">'+icon('close',16)+'</button></div><div class="mb col"><div class="checker" id="upPrev"></div>'+
      '<label class="chk"><input type="checkbox" id="upRm"'+(st.alpha?'':' checked')+'><span>Xoá nền đồng màu (thường là nền trắng)</span></label>'+
      '<label class="sl"><span>Độ nhạy khi xoá nền</span><output id="upTolO">28</output><input type="range" id="upTol" min="4" max="80" value="28"></label>'+
      '<p class="tip">Ảnh nên chụp thẳng, đủ sáng, cả sản phẩm nằm trong khung. Nền càng đơn giản thì xoá càng sạch. Nếu ảnh đã có nền trong suốt, bạn có thể tắt tuỳ chọn này.</p></div>'+
      '<div class="mf"><button class="btn" data-x>Huỷ</button><button class="btn pri" id="upOk">Dùng ảnh này</button></div>','sm');
    let cur=src,done=false;
    const draw=()=>{
      const on=$('#upRm',bg).checked,tol=+$('#upTol',bg).value;$('#upTolO',bg).textContent=tol;
      cur=on?removeBg(src,tol):src;
      const pv=$('#upPrev',bg);pv.innerHTML='';pv.appendChild(cur);
    };
    $('#upRm',bg).addEventListener('change',draw);$('#upTol',bg).addEventListener('input',draw);
    $('#upOk',bg).addEventListener('click',()=>{
      const alpha=st.alpha||$('#upRm',bg).checked;
      done=true;const out={img:encodeImg(cur,alpha),w:cur.width,h:cur.height};closeModal(bg);resolve(out);
    });
    bg._onclose=()=>{if(!done)resolve(null);};
    draw();
  });
}

/* ===== Lưu cục bộ (chỉ bản HTML độc lập) ===== */
const STANDALONE=!(window.claude&&typeof window.claude.use==='function');
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('davis-studio',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbGet(k){try{const db=await idb();return await new Promise(res=>{const t=db.transaction('kv').objectStore('kv').get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>res(null);});}catch(e){return null;}}
async function idbSet(k,v){try{const db=await idb();return await new Promise(res=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false);});}catch(e){return false;}}
function saveLocal(){S.data.savedAt=Date.now();idbSet('data',clone(S.data));}

/* ===== Chuẩn hoá dữ liệu ===== */
function normalizeData(d){
  d.contact=Object.assign({zalo:'',messenger:'',web:'davis.vn'},d.contact||{});
  d.brand=d.brand||'Davis';d.msg=d.msg||'';d.adminPass=d.adminPass||'';
  if(!Array.isArray(d.leathers)||!d.leathers.length)d.leathers=clone(DEFAULT_LEATHERS);
  d.leathers.forEach(l=>{if(!l.id)l.id='l'+uid();if(l.img==null)l.img='';});
  if(!Array.isArray(d.motifs))d.motifs=[];
  d.motifs.forEach(m=>{if(!m.id)m.id='mo'+uid();if(m.category==null)m.category='';if(!m.name)m.name='Mẫu khắc';});
  const di=defaultIntro();
  if(!d.intro||typeof d.intro!=='object')d.intro=di;
  else{
    ['title','lead','colorTitle','colorNote'].forEach(k=>{if(typeof d.intro[k]!=='string')d.intro[k]=di[k];});
    ['img','video'].forEach(k=>{if(typeof d.intro[k]!=='string')d.intro[k]='';});
    ['highlights','steps','faq'].forEach(k=>{if(!Array.isArray(d.intro[k]))d.intro[k]=di[k];});
  }
  d.gallery=(Array.isArray(d.gallery)?d.gallery:[]).filter(g=>g&&g.img);
  d.gallery.forEach(g=>{if(!g.id)g.id='g'+uid();g.caption=g.caption||'';g.product=g.product||'';g.leather=g.leather||'';});
  d.products=(d.products||[]).map(p=>{
    p.id=p.id||'p'+uid();p.code=p.code||'?';p.name=p.name||'';p.sides=(p.sides||[]).map(s=>{
      s.id=s.id||'s'+uid();s.label=s.label||'Mặt';s.img=s.img||'';
      if(s.recolor===undefined)s.recolor=true;return s;});
    return p;});
  return d;
}

/* ===== Khởi động ===== */
function renderAll(){renderPicker();renderStagebar();renderInspector();fit();requestRender();updateUndoUI();}
function setProduct(pid){
  S.pid=pid;const p=prod();S.sid=validSides(p)[0].id;S.sel=null;S.fontOpen=false;dsg(pid);renderAll();ensureUsedFonts();
}
function bindMain(){
  $('#btnUndo').innerHTML=icon('undo');$('#btnRedo').innerHTML=icon('redo');
  $('#btnAdmin').innerHTML=icon('gear');$('#btnExport').innerHTML=icon('download',16)+'Xuất ảnh';
  $('#btnUndo').addEventListener('click',undo);$('#btnRedo').addEventListener('click',redo);
  $('#btnExport').addEventListener('click',openExport);$('#btnAdmin').addEventListener('click',openAdmin);
  $('#picker').addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.gl){GAL.leather=b.dataset.gl;GAL.product='all';showView('gallery');}
    else if(b.dataset.pid)setProduct(b.dataset.pid);
    else if(b.dataset.leather){const p=prod();dsg(p.id).leather=b.dataset.leather;commit();renderPicker();requestRender();}
  });
  $('#stagebar').addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.sid){S.sid=b.dataset.sid;S.sel=null;S.fontOpen=false;renderAll();ensureUsedFonts();}
    else if(b.id==='btnAddText')addText();
    else if(b.id==='btnAddImg')openMotifPicker();
  });
  $('#userFile').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(f)addImageFile(f);});
  const c=cv();
  c.addEventListener('pointerdown',onDown);c.addEventListener('pointermove',onMove);
  c.addEventListener('pointerup',onUp);c.addEventListener('pointercancel',onUp);
  c.addEventListener('dblclick',()=>{const el=selEl();if(el&&el.type==='text'){const t=$('#f-text');if(t){t.focus();t.select();}}});
  bindInspector();
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&modals.length){closeModal(modals[modals.length-1]);return;}
    if(modals.length&&modals[modals.length-1]._onkey){modals[modals.length-1]._onkey(e);return;}
    const tag=(e.target.tagName||'').toLowerCase();if(tag==='input'||tag==='textarea'||tag==='select'||$('#adm'))return;
    if(VIEW!=='design')return;
    const mod=e.ctrlKey||e.metaKey;
    if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}
    if(mod&&e.key.toLowerCase()==='y'){e.preventDefault();redo();return;}
    const el=selEl();if(!el)return;
    if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();delSel();return;}
    const st=e.shiftKey?10:1,mv={ArrowLeft:[-st,0],ArrowRight:[st,0],ArrowUp:[0,-st],ArrowDown:[0,st]}[e.key];
    if(mv){e.preventDefault();el.x+=mv[0];el.y+=mv[1];commit('nudge');requestRender();}
  });
  if(window.ResizeObserver)new ResizeObserver(()=>{fit();requestRender();}).observe($('#stage'));
  window.addEventListener('resize',()=>{fit();requestRender();});
}
async function detectCaps(){
  const c=window.claude;
  if(!c||typeof c.use!=='function'){if(MODE==='admin')$('#btnAdmin').hidden=false;return;}
  try{CAP.downloads=await c.use('downloads');}catch(e){}
  try{CAP.artifact=await c.use('artifact');}catch(e){}
  try{const u=await c.use('user');CAP.canEdit=u?!!(await u.canEdit()):false;}catch(e){}
  if(CAP.canEdit)$('#btnAdmin').hidden=false;
}

}
init();
